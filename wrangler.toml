name = "domain-parkour"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ──────────────────────────────────────────────────────────────────────────────
# D1 database — stores per-hostname configs, edited via /_admin_/.
# Setup:
#   npm run setup          # creates DB, writes the id below, applies migrations
# Or manually:
#   wrangler d1 create domain-parkour-db
#   wrangler d1 migrations apply domain-parkour-db --local
#   wrangler d1 migrations apply domain-parkour-db --remote
# ──────────────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "domain-parkour-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# ──────────────────────────────────────────────────────────────────────────────
# Routes — uncomment to map domains to this worker. Add a row per hostname.
# routes = [
#   { pattern = "cdn.farm",    zone_name = "cdn.farm" },
#   { pattern = "example.com", zone_name = "example.com" },
# ]
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Admin credentials — set as SECRETS, not vars:
#   wrangler secret put ADMIN_USER
#   wrangler secret put ADMIN_PASSWORD
# For local dev, put them in .dev.vars (already created by `npm run setup`).
# ──────────────────────────────────────────────────────────────────────────────
