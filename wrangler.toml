name = "domain-parkour"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Worker logs in the Cloudflare dashboard (and `pnpm tail`). Off by default.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# ──────────────────────────────────────────────────────────────────────────────
# D1 database — stores per-hostname configs, edited via /_admin_/.
# Setup:
#   pnpm setup             # creates DB, writes the id below, applies migrations
# Or manually:
#   wrangler d1 create domain-parkour-db
#   wrangler d1 migrations apply domain-parkour-db --local
#   wrangler d1 migrations apply domain-parkour-db --remote
# ──────────────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "domain-parkour-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# R2 object storage - profile images now, reusable for future page assets.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "domain-parkour-assets"

# ──────────────────────────────────────────────────────────────────────────────
# Routes — uncomment to map domains to this worker. Add a row per hostname.
# routes = [
#   { pattern = "cdn.farm",    zone_name = "cdn.farm" },
#   { pattern = "example.com", zone_name = "example.com" },
# ]
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Admin credentials — set as SECRETS, not vars:
#   wrangler secret put ADMIN_USER
#   wrangler secret put ADMIN_PASSWORD
# For local dev, put them in .dev.vars (created by `pnpm setup` or `pnpm dev:local`).
# ──────────────────────────────────────────────────────────────────────────────
