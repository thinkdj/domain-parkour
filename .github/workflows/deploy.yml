# Run `npm run deploy` to deploy to CF from a local machine (GH Actions not required).
# Or trigger this workflow manually from the Actions tab.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   - Workers + D1 read/write
#   CLOUDFLARE_ACCOUNT_ID  - your account id
#
# Admin credentials (ADMIN_USER / ADMIN_PASSWORD) must be set via
# `wrangler secret put` on the worker itself, not here.

name: Deploy App to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply domain-parkour-db --remote

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
