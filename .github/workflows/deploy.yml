# Run `pnpm deploy` to deploy from a local machine (GitHub Actions is optional).
# Or trigger this workflow manually from the Actions tab.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN   - Workers, D1, and R2 read/write
#   CLOUDFLARE_ACCOUNT_ID  - your account id
#
# Run `pnpm setup --remote` once before this workflow so D1 and R2 exist.
#
# Admin credentials (ADMIN_USER / ADMIN_PASSWORD) must be set via
# `wrangler secret put` on the worker itself, not here.

name: Deploy Domain Parkour OSS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Apply D1 migrations (remote)
        run: pnpm db:migrate:remote

      - name: Deploy to Cloudflare Workers
        run: pnpm deploy
